services:
  postgres:
    image: postgres:16-alpine
    container_name: incognito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: incognito_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incognito_secure_dev_pass_2026}
      POSTGRES_DB: incognito_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incognito_app -d incognito_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
